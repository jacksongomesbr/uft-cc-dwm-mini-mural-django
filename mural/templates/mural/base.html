{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}{% endblock %} · Mini Mural</title>
    <link rel="stylesheet" href="{% static 'mural/css/estilo.css' %}">
</head>
<body>
    <header class="topo">
        <nav class="coluna navegacao" aria-label="Principal">
            {# user vem do context processor auth; a navegação muda conforme o login. #}
            {% if user.is_authenticated %}
                <a href="{% url 'mural' %}" {% if pagina_atual == 'mural' %}aria-current="page"{% endif %}>Mural</a>
                <a href="{% url 'sobre' %}" {% if pagina_atual == 'sobre' %}aria-current="page"{% endif %}>Sobre</a>
                <form class="sessao" method="post" action="{% url 'sair' %}">
                    {% csrf_token %}
                    <span class="apoio">{{ user.username }}</span>
                    <button type="submit" class="botao-texto">Sair</button>
                </form>
            {% else %}
                <a href="{% url 'entrar' %}" {% if pagina_atual == 'entrar' %}aria-current="page"{% endif %}>Entrar</a>
                <a href="{% url 'cadastro' %}" {% if pagina_atual == 'cadastro' %}aria-current="page"{% endif %}>Criar conta</a>
            {% endif %}
        </nav>
    </header>
    <main class="coluna">
        {% block conteudo %}{% endblock %}
    </main>
    <script src="{% static 'mural/js/mural.js' %}" defer></script>
</body>
</html>

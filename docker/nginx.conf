# Site do Mini Mural no contêiner do nginx. É o servidor/nginx.conf com duas
# diferenças: escuta na porta 80 do contêiner e encontra o Gunicorn pelo nome
# do serviço, app, em vez de 127.0.0.1.

server {
    listen 80;
    server_name localhost;

    # O volume estaticos, que o serviço app preenche com o collectstatic.
    location /static/ {
        alias /estaticos/;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Mini Mural no nginx, na frente do Gunicorn.
#
# No Debian e no Ubuntu, copie para /etc/nginx/sites-available/mini-mural,
# crie o atalho e recarregue:
#   sudo ln -s /etc/nginx/sites-available/mini-mural /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# O nginx não executa Python. Ele entrega o CSS e o JavaScript direto do disco
# e repassa os outros pedidos ao Gunicorn, que roda o Django em um processo
# separado (servidor/mini-mural.service). Troque /var/www/mini-mural pela
# pasta do projeto.

server {
    # Porta própria: a 80 é do site padrão do nginx no Debian e no Ubuntu, e a
    # 8080, do site padrão no Homebrew.
    listen 8081;
    server_name localhost;

    # Arquivos estáticos: a pasta staticfiles/ que o collectstatic preenche.
    # O Django nem fica sabendo desses pedidos.
    location /static/ {
        alias /var/www/mini-mural/staticfiles/;
    }

    # Todo o resto vai para o Gunicorn.
    location / {
        proxy_pass http://127.0.0.1:8000;

        # O Django confere o nome do site (ALLOWED_HOSTS) pelo cabeçalho Host.
        # Sem esta linha, ele receberia "127.0.0.1:8000".
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

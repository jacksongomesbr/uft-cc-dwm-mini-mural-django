# Mini Mural no Apache com mod_wsgi.
#
# No Debian e no Ubuntu, copie para /etc/apache2/sites-available/mini-mural.conf
# e ative com:
#   sudo a2ensite mini-mural
#   sudo systemctl reload apache2
#
# O pacote libapache2-mod-wsgi-py3 carrega o Python dentro do Apache. Ele é
# compilado para o python3 do sistema, então o ambiente virtual .venv precisa
# ser criado com esse mesmo python3. Troque /var/www/mini-mural pela pasta do
# projeto.

# Porta própria, para não disputar a porta 80 com o site padrão do Apache.
Listen 8081

<VirtualHost *:8081>
    ServerName localhost

    # Os arquivos estáticos o Apache entrega direto da pasta que o
    # collectstatic preenche, sem chamar o Django.
    Alias /static/ /var/www/mini-mural/staticfiles/

    <Directory /var/www/mini-mural/staticfiles>
        Require all granted
    </Directory>

    # Processos próprios para o Django, com o Python do ambiente virtual do
    # projeto. O Apache cria e religa esses processos sozinho.
    WSGIDaemonProcess mini-mural python-home=/var/www/mini-mural/.venv python-path=/var/www/mini-mural processes=2 threads=5
    WSGIProcessGroup mini-mural

    # Os demais pedidos vão para a application de mini_mural/wsgi.py.
    WSGIScriptAlias / /var/www/mini-mural/mini_mural/wsgi.py

    <Directory /var/www/mini-mural/mini_mural>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # O que o Django escreve na saída de erro, inclusive as exceções, vem
    # para cá.
    ErrorLog ${APACHE_LOG_DIR}/mini-mural-erro.log
    CustomLog ${APACHE_LOG_DIR}/mini-mural-acesso.log combined
</VirtualHost>
